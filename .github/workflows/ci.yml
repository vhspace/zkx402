name: CI

on:
  push:
  pull_request:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install workspace deps (root)
        run: corepack enable && pnpm install --ignore-scripts

      - name: Unit tests (repo tools)
        run: pnpm run test:tools

      - name: Lint (x402-zkx402)
        run: pnpm --filter x402-zkx402 lint

      - name: Unit tests (x402-zkx402)
        run: pnpm --filter x402-zkx402 test

      - name: E2E (local chain)
        working-directory: apps/demo/local-chain
        run: node run-e2e-test.js
