name: CI

on:
  push:
  pull_request:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable pnpm (corepack)
        run: corepack enable && corepack prepare pnpm@10.7.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install workspace deps (root)
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Guard X-PAYMENT payloads against x402 npm schema (#117)
        run: pnpm --filter x402-zkx402 exec node --test test/x_payment_schema.test.js

      - name: Unit tests (repo tools)
        run: pnpm run test:tools

      - name: Lint (x402-zkx402)
        run: pnpm --filter x402-zkx402 lint

      - name: Unit tests (x402-zkx402)
        run: pnpm --filter x402-zkx402 test

      - name: Lint (x402-kit)
        run: pnpm --filter x402-kit lint

      - name: Unit tests (x402-kit)
        run: pnpm --filter x402-kit test

      - name: E2E (local chain)
        working-directory: apps/demo/local-chain
        run: node run-e2e-test.js
