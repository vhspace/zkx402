name: CI

on:
  push:
  pull_request:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install workspace deps (root)
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Unit tests (repo tools)
        run: npm run test:tools

      - name: Lint (x402-zkx402)
        working-directory: packages/x402-zkx402
        run: npm run lint

      - name: Unit tests (x402-zkx402)
        working-directory: packages/x402-zkx402
        run: npm test

      - name: Install local-chain deps
        working-directory: apps/demo/local-chain
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: E2E (local chain)
        working-directory: apps/demo/local-chain
        run: node run-e2e-test.js
