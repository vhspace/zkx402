name: Deploy to Vercel (Production)

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (lint/build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Repo tool tests
        run: npm run test:tools

      - name: Server syntax check
        run: node --check apps/demo/server/index.js

      - name: Client lint
        run: npm run lint --workspace=apps/demo/client

      - name: Client build
        run: npm run build --workspace=apps/demo/client

  deploy-prod:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      deployments: write
    # Avoid running in forks by default (forks won't have the required secrets).
    if: github.repository == 'vhspace/zkx402' && github.event_name != 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_SERVER: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}
      VERCEL_PROJECT_ID_CLIENT: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "Missing required secret: VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "Missing required secret: VERCEL_ORG_ID"
            exit 1
          fi
          if [ -z "${VERCEL_PROJECT_ID_SERVER}" ]; then
            echo "Missing required secret: VERCEL_PROJECT_ID_SERVER"
            exit 1
          fi
          if [ -z "${VERCEL_PROJECT_ID_CLIENT}" ]; then
            echo "Missing required secret: VERCEL_PROJECT_ID_CLIENT"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Info: CLOUDFLARE_API_TOKEN not set - DNS updates will be skipped (optional)"
          fi

      - name: Deploy backend (apps/demo/server) to production
        run: |
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID_SERVER}"
          export VERCEL_ORG_ID="${VERCEL_ORG_ID}"
          npx --yes vercel@latest deploy --prod --yes --token="${VERCEL_TOKEN}" --cwd apps/demo/server

      - name: Deploy frontend (apps/demo/client) to production
        id: deploy_frontend_prod
        run: |
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID_CLIENT}"
          export VERCEL_ORG_ID="${VERCEL_ORG_ID}"
          OUT="$(npx --yes vercel@latest deploy --prod --yes --token="${VERCEL_TOKEN}" --cwd apps/demo/client 2>&1)"
          echo "$OUT"
          # Try multiple patterns to extract the URL - Vercel CLI output format may vary
          URL="$(echo "$OUT" | grep -oE 'https?://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            echo "Failed to parse frontend prod URL from vercel output"
            echo "=== Full Vercel Output ==="
            echo "$OUT"
            exit 1
          fi
          echo "frontend_prod_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update Cloudflare DNS for zkx402.io (optional)
        if: success() && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          echo "🔄 Updating DNS records to point zkx402.io to ${{ steps.deploy_frontend_prod.outputs.frontend_prod_url }}"
          if node scripts/cloudflare-dns-update.mjs ${{ steps.deploy_frontend_prod.outputs.frontend_prod_url }}; then
            echo "✅ DNS update completed successfully"
          else
            echo "⚠️ DNS update failed, but deployment continues. Add CLOUDFLARE_API_TOKEN secret to enable automatic DNS updates."
          fi

      - name: Report GitHub deployment (production)
        if: always()
        uses: actions/github-script@v7
        env:
          FRONTEND_URL: ${{ steps.deploy_frontend_prod.outputs.frontend_prod_url }}
        with:
          script: |
            const sha = context.sha;
            const envName = 'production';
            const url = process.env.FRONTEND_URL;

            // Create a Deployment so GitHub shows "deployed" for the commit/branch.
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: envName,
              auto_merge: false,
              required_contexts: [],
              description: `Vercel production deployment${url ? `: ${url}` : ''}`,
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: url ? 'success' : 'error',
              environment: envName,
              environment_url: url || undefined,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: url ? 'Deployed to Vercel (prod)' : 'Deployed to Vercel (prod) but URL parse failed',
            });

  deploy-preview:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      deployments: write
    # Only run previews for PRs coming from this repo (not forks), since secrets aren't exposed to forks.
    if: github.repository == 'vhspace/zkx402' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_SERVER: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}
      VERCEL_PROJECT_ID_CLIENT: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}
    outputs:
      backend_url: ${{ steps.deploy_backend.outputs.backend_url }}
      frontend_url: ${{ steps.deploy_frontend.outputs.frontend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID_SERVER}" ] || [ -z "${VERCEL_PROJECT_ID_CLIENT}" ]; then
            echo "Missing required Vercel secrets; skipping."
            exit 1
          fi

      - name: Deploy backend preview (apps/demo/server)
        id: deploy_backend
        shell: bash
        run: |
          set -euo pipefail
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID_SERVER}"
          export VERCEL_ORG_ID="${VERCEL_ORG_ID}"
          OUT="$(npx --yes vercel@latest deploy --yes --token="${VERCEL_TOKEN}" --cwd apps/demo/server 2>&1)"
          echo "$OUT"
          # Try multiple patterns to extract the URL - Vercel CLI output format may vary
          URL="$(echo "$OUT" | grep -oE 'https?://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            echo "Failed to parse backend preview URL from vercel output"
            echo "=== Full Vercel Output ==="
            echo "$OUT"
            exit 1
          fi
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend preview (apps/demo/client)
        id: deploy_frontend
        shell: bash
        run: |
          set -euo pipefail
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID_CLIENT}"
          export VERCEL_ORG_ID="${VERCEL_ORG_ID}"
          OUT="$(npx --yes vercel@latest deploy --yes --token="${VERCEL_TOKEN}" --cwd apps/demo/client 2>&1)"
          echo "$OUT"
          # Try multiple patterns to extract the URL - Vercel CLI output format may vary
          URL="$(echo "$OUT" | grep -oE 'https?://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            echo "Failed to parse frontend preview URL from vercel output"
            echo "=== Full Vercel Output ==="
            echo "$OUT"
            exit 1
          fi
          echo "frontend_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Report GitHub deployment (preview)
        if: always()
        uses: actions/github-script@v7
        env:
          FRONTEND_URL: ${{ steps.deploy_frontend.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.deploy_backend.outputs.backend_url }}
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const envName = 'preview';
            const frontend = process.env.FRONTEND_URL;
            const backend = process.env.BACKEND_URL;
            const envUrl = frontend || backend;
            const desc = `Vercel preview deployment${frontend ? ` (frontend: ${frontend})` : ''}${backend ? ` (backend: ${backend})` : ''}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: envName,
              auto_merge: false,
              required_contexts: [],
              description: desc,
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: envUrl ? 'success' : 'error',
              environment: envName,
              environment_url: envUrl || undefined,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: envUrl ? 'Deployed to Vercel (preview)' : 'Deployed to Vercel (preview) but URL parse failed',
            });

  e2e-preview:
    name: Browser E2E (Preview URL)
    runs-on: ubuntu-latest
    needs: deploy-preview
    permissions:
      contents: read
    if: github.repository == 'vhspace/zkx402' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against frontend preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/**
            playwright-report/**



